services:
  - type: web
    name: google-mcp-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: GOOGLE_CLIENT_SECRETS_B64
        sync: false
      - key: GOOGLE_TOKEN_B64
        sync: false
      - key: MCP_APPROVAL
        value: "1"